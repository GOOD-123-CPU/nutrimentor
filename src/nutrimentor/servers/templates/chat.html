{# NutriMentor unified chat UI — one template, three personas via Jinja var #}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ persona_title }} · NutriMentor</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --line:#2a2f3a;
      --ink:#e8eaf0; --muted:#9aa3b2;
      --accent:#4f8cff; --accent-2:#7c5cff;
      --user-bg:#243044; --bot-bg:#1b2a1f; --bot-line:#2e4a35;
      --ok:#3ecf8e; --warn:#f5a623; --danger:#ff6b6b;
    }
    [data-persona="student"]{ --accent:#ff8c42; --accent-2:#ffd166; --bot-bg:#241d14; --bot-line:#4a3a24; }
    [data-persona="teacher"]{ --accent:#4f8cff; --accent-2:#7c5cff; }
    [data-persona="researcher"]{ --accent:#3ecf8e; --accent-2:#2dd4bf; --bot-bg:#14231f; --bot-line:#28453b; }

    *{box-sizing:border-box; margin:0}
    body{
      font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background:var(--bg); color:var(--ink); min-height:100vh; display:flex; flex-direction:column;
    }
    header{
      display:flex; align-items:center; gap:14px; padding:14px 22px;
      background:var(--panel); border-bottom:1px solid var(--line);
      position:sticky; top:0; z-index:10;
    }
    .logo{ width:34px; height:34px; border-radius:10px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex; align-items:center; justify-content:center; font-size:18px; }
    .titles{ flex:1 }
    .titles h1{ font-size:16px; font-weight:700; letter-spacing:.2px }
    .titles p{ font-size:12px; color:var(--muted); margin-top:2px }
    nav{ display:flex; gap:8px }
    .persona-btn{
      padding:7px 14px; border-radius:9px; border:1px solid var(--line);
      background:var(--panel-2); color:var(--muted); text-decoration:none;
      font-size:13px; font-weight:600; transition:all .15s;
    }
    .persona-btn:hover{ color:var(--ink); border-color:var(--accent) }
    .persona-btn.active{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent }

    main{ flex:1; display:flex; flex-direction:column; max-width:900px; width:100%; margin:0 auto; padding:20px 16px 0 }
    #chat{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding:10px 4px 20px; scroll-behavior:smooth }
    .msg{ max-width:82%; padding:12px 16px; border-radius:14px; line-height:1.7; font-size:14.5px;
          word-break:break-word; box-shadow:0 2px 8px rgba(0,0,0,.25) }
    .msg.user{ align-self:flex-end; background:var(--user-bg); border-bottom-right-radius:4px }
    .msg.bot{ align-self:flex-start; background:var(--bot-bg); border:1px solid var(--bot-line); border-bottom-left-radius:4px }
    .msg strong{ color:var(--accent-2) }
    .typing{ color:var(--muted); font-style:italic }
    .typing:after{ content:"…"; animation:blink 1.2s infinite }
    @keyframes blink{ 50%{opacity:.3} }

    .sources{ align-self:flex-start; max-width:82%; width:100% }
    .sources summary{ cursor:pointer; color:var(--muted); font-size:12.5px; font-weight:600; padding:6px 0 }
    .src-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
               padding:10px 14px; margin:6px 0; font-size:12.5px; color:var(--muted) }
    .src-card b{ color:var(--ink); display:block; margin-bottom:3px }
    .src-card a{ color:var(--accent); text-decoration:none }
    .src-card .meta{ font-size:11.5px; color:var(--muted) }

    .composer{ display:flex; gap:10px; padding:14px 0 18px; position:sticky; bottom:0;
               background:linear-gradient(transparent,var(--bg) 30%) }
    .composer input{
      flex:1; padding:13px 16px; border-radius:12px; border:1px solid var(--line);
      background:var(--panel); color:var(--ink); font-size:14.5px; outline:none; transition:border .15s;
    }
    .composer input:focus{ border-color:var(--accent) }
    .composer button{
      padding:12px 22px; border-radius:12px; border:none; cursor:pointer;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#fff; font-weight:700; font-size:14.5px; transition:opacity .15s;
    }
    .composer button:disabled{ opacity:.45; cursor:not-allowed }
    .footnote{ text-align:center; color:var(--muted); font-size:11.5px; padding:0 0 14px }

    @media(max-width:640px){
      .msg{max-width:94%} .sources{max-width:94%}
      header{flex-wrap:wrap} nav{width:100%; justify-content:flex-start}
    }
  </style>
</head>
<body data-persona="{{ persona }}">
  <header>
    <div class="logo">🥗</div>
    <div class="titles">
      <h1>{{ persona_title }}</h1>
      <p>{{ persona_tagline }}</p>
    </div>
    <nav>
      <a class="persona-btn {{ 'active' if persona=='student' }}" href="/student/">学生版</a>
      <a class="persona-btn {{ 'active' if persona=='teacher' }}" href="/teacher/">教师版</a>
      <a class="persona-btn {{ 'active' if persona=='researcher' }}" href="/researcher/">科研版</a>
    </nav>
  </header>

  <main>
    <div id="chat">
      <div class="msg bot">{{ persona_hello }}</div>
    </div>
    <div class="composer">
      <input id="q" type="text" placeholder="{{ persona_placeholder }}" autocomplete="off" />
      <button id="send">发送</button>
    </div>
    <div class="footnote">内容由 AI 基于索引文献生成，仅供教学参考，不构成医疗建议 · NutriMentor</div>
  </main>

  <script>
    const PERSONA = "{{ persona }}";
    const chat = document.getElementById("chat");
    const qEl = document.getElementById("q");
    const sendBtn = document.getElementById("send");
    let sessionId = null;

    function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
    function fmt(s){
      return esc(s)
        .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
        .replace(/\[(文献|Paper)\s*(\d+)\]/g,"<strong>[$1 $2]</strong>")
        .replace(/\n/g,"<br>");
    }
    function addMsg(text, who, raw){
      const d=document.createElement("div"); d.className="msg "+who;
      if(raw){ d.innerHTML=text; } else { d.innerHTML=fmt(text); }
      chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
    }

    function renderSources(list){
      if(!list||!list.length) return null;
      const wrap=document.createElement("details"); wrap.className="sources";
      wrap.innerHTML=`<summary>📚 参考来源（${list.length}）</summary>`;
      list.forEach(s=>{
        const c=document.createElement("div"); c.className="src-card";
        const link = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title);
        c.innerHTML = `<b>${link}</b>
          <span class="meta">${s.pmid?"PMID:"+esc(s.pmid)+" · ":""}${esc(s.journal||"")}${s.year?" "+esc(s.year):""} · 相关度 ${(s.score*100).toFixed(0)}%</span>`;
        wrap.appendChild(c);
      });
      chat.appendChild(wrap); chat.scrollTop=chat.scrollHeight;
      return wrap;
    }

    async function askStream(question){
      const thinking = addMsg("思考中", "bot", false);
      thinking.classList.add("typing");
      let botDiv = null;
      try{
        const resp = await fetch(`/${PERSONA}/api/ask/stream`,{
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({question, session_id: sessionId})
        });
        thinking.remove();
        if(!resp.ok || !resp.body){ addMsg("⚠️ 服务暂不可用，请确认已运行 python -m nutrimentor.cli.ingest", "bot"); return; }
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while(true){
          const {done, value} = await reader.read();
          if(done) break;
          buf += dec.decode(value, {stream:true});
          let sep;
          while((sep = buf.indexOf("\n\n")) >= 0){
            const block = buf.slice(0, sep); buf = buf.slice(sep+2);
            const evLine = block.split("\n").find(l=>l.startsWith("event: "));
            const dataLine = block.split("\n").find(l=>l.startsWith("data: "));
            if(!evLine||!dataLine) continue;
            const event = evLine.slice(7).trim();
            const data = JSON.parse(dataLine.slice(6));
            if(event==="sources"){ renderSources(data); }
            else if(event==="delta"){
              if(!botDiv) botDiv = addMsg("", "bot");
              botDiv._raw = (botDiv._raw||"") + data;
              botDiv.innerHTML = fmt(botDiv._raw);
              chat.scrollTop = chat.scrollHeight;
            }
            else if(event==="done"){ if(data.session_id) sessionId = data.session_id; }
          }
        }
      }catch(e){
        thinking.remove();
        addMsg("⚠️ 网络异常，请稍后重试", "bot");
      }
    }

    async function ask(){
      const text = qEl.value.trim(); if(!text) return;
      sendBtn.disabled = true; qEl.disabled = true;
      addMsg(text,"user"); qEl.value="";
      await askStream(text);
      sendBtn.disabled=false; qEl.disabled=false; qEl.focus();
    }

    sendBtn.addEventListener("click", ask);
    qEl.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); ask(); }});
  </script>
</body>
</html>
